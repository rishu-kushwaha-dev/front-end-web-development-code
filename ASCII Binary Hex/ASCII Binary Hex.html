<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ASCII • Binary • Hex Converter</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="ASCII Binary Hex.css">
    </head>

    <body>
        <div class="container">
            <header class="header">
                <h1>ASCII <span class="separator">•</span> Binary <span class="separator">•</span> Hex Converter</h1>
                <p class="subtitle">Convert between text, ASCII codes, binary, and hexadecimal</p>
            </header>

            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="text-to-code" onclick="setMode('text-to-code')">
                    <i class="fas fa-arrow-right"></i> Text → Codes
                </button>
                <button class="mode-btn" data-mode="code-to-text" onclick="setMode('code-to-text')">
                    <i class="fas fa-arrow-left"></i> Codes → Text
                </button>
            </div>

            <!-- Text to Code Mode -->
            <div id="textToCodeMode">
                <div class="input-section">
                    <div class="section-header">
                        <label for="textInput">
                            <i class="fas fa-keyboard"></i> Input Text
                        </label>
                        <span class="char-count" id="charCount">0 characters</span>
                    </div>
                    <textarea id="textInput" placeholder="Type or paste your text here..."
                        oninput="convertText()"></textarea>
                </div>

                <div class="output-section">
                    <div class="output-box">
                        <div class="output-header">
                            <label>
                                <i class="fas fa-list-ol"></i> ASCII Codes
                            </label>
                            <button class="copy-btn" onclick="copyToClipboard('asciiOutput', this)"
                                title="Copy to clipboard">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                        <textarea id="asciiOutput" readonly
                            placeholder="ASCII decimal values will appear here..."></textarea>
                    </div>

                    <div class="output-box">
                        <div class="output-header">
                            <label>
                                <i class="fas fa-microchip"></i> Binary (8-bit)
                            </label>
                            <button class="copy-btn" onclick="copyToClipboard('binaryOutput', this)"
                                title="Copy to clipboard">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                        <textarea id="binaryOutput" readonly
                            placeholder="Binary representation will appear here..."></textarea>
                    </div>

                    <div class="output-box">
                        <div class="output-header">
                            <label>
                                <i class="fas fa-hashtag"></i> Hexadecimal (Uppercase)
                            </label>
                            <button class="copy-btn" onclick="copyToClipboard('hexOutput', this)"
                                title="Copy to clipboard">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                        <textarea id="hexOutput" readonly
                            placeholder="Hexadecimal values will appear here..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Code to Text Mode -->
            <div id="codeToTextMode" style="display: none;">
                <div class="input-section">
                    <div class="section-header">
                        <label for="codeInput">
                            <i class="fas fa-code"></i> Input Codes
                        </label>
                        <select id="codeType" onchange="convertFromCode()">
                            <option value="ascii">ASCII Decimal</option>
                            <option value="binary">Binary (8-bit)</option>
                            <option value="hex">Hexadecimal</option>
                        </select>
                    </div>
                    <textarea id="codeInput" placeholder="Enter space-separated values (e.g., 72 101 108 108 111)"
                        oninput="convertFromCode()"></textarea>
                    <p class="hint" id="codeHint">Enter space or comma separated ASCII decimal values</p>
                </div>

                <div class="output-section">
                    <div class="output-box">
                        <div class="output-header">
                            <label>
                                <i class="fas fa-font"></i> Result Text
                            </label>
                            <button class="copy-btn" onclick="copyToClipboard('textOutput', this)"
                                title="Copy to clipboard">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                        <textarea id="textOutput" readonly placeholder="Converted text will appear here..."></textarea>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
            </div>
        </div>

        <footer class="footer">
            <p>Made with <i class="fas fa-heart"></i> for developers</p>
        </footer>

        <div id="toast" class="toast">Copied to clipboard!</div>

        <script src="ASCII Binary Hex.js"></script>
    </body>

</html>

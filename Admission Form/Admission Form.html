<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admission Form</title>
        <link rel="stylesheet" href="Admission Form.css">
    </head>

    <body>

        <div class="form-container">
            <!-- Form Header -->
            <h2>Admission Form</h2>

            <!-- Step Navigation Tabs -->
            <div class="form-tabs">
                <button class="tab-btn active" onclick="switchStep(1)">Student Details</button>
                <button class="tab-btn" onclick="switchStep(2)">Parent/Guardian Details</button>
                <button class="tab-btn" onclick="switchStep(3)">Academic & Submit</button>
            </div>

            <!-- Form Body -->
            <form id="admissionForm">
                <!-- STEP 1: Student Details -->
                <div class="form-step active" id="step-1">
                    <div class="section-title">Name</div>
                    <div class="input-row">
                        <div class="input-group">
                            <input type="text" placeholder="First Name" required>
                        </div>
                        <div class="input-group">
                            <input type="text" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="section-title">Date of Birth</div>
                    <div class="input-group full-width">
                        <input type="date" required>
                    </div>

                    <div class="section-title">Gender</div>
                    <div class="input-group full-width">
                        <select required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="section-title">Email</div>
                    <div class="input-group full-width">
                        <input type="email" placeholder="Email Address" required>
                    </div>

                    <div class="section-title">Phone</div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Phone Number" inputmode="numeric" pattern="[0-9]{10,15}"
                            maxlength="15" title="Enter a valid phone number (10-15 digits)"
                            oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                    </div>

                    <div class="section-title">Permanent Address</div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Street Address" required>
                    </div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Address Line 2">
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <select required>
                                <option value="" disabled selected>City</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Mumbai">Mumbai</option>
                                <option value="Kolkata">Kolkata</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Bengaluru">Bengaluru</option>
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Pune">Pune</option>
                                <option value="Ahmedabad">Ahmedabad</option>
                                <option value="Jaipur">Jaipur</option>
                                <option value="Lucknow">Lucknow</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <select required>
                                <option value="" disabled selected>State/Region/Province</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Bihar">Bihar</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Haryana">Haryana</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="West Bengal">West Bengal</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <input type="text" placeholder="Postal / Zip Code" inputmode="numeric" pattern="[0-9]{4,10}"
                                maxlength="10" title="Enter a valid ZIP/postal code (numbers only)"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                        </div>
                        <div class="input-group">
                            <select required>
                                <option value="" disabled selected>Country</option>
                                <option value="IN">India</option>
                                <option value="US">United States</option>
                                <option value="UK">United Kingdom</option>
                                <option value="CA">Canada</option>
                            </select>
                        </div>
                    </div>

                    <div class="section-title">Temporary Address</div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Street Address">
                    </div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Address Line 2">
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <select>
                                <option value="" disabled selected>City</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Mumbai">Mumbai</option>
                                <option value="Kolkata">Kolkata</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Bengaluru">Bengaluru</option>
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Pune">Pune</option>
                                <option value="Ahmedabad">Ahmedabad</option>
                                <option value="Jaipur">Jaipur</option>
                                <option value="Lucknow">Lucknow</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <select>
                                <option value="" disabled selected>State/Region/Province</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Bihar">Bihar</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Haryana">Haryana</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="West Bengal">West Bengal</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <input type="text" placeholder="Postal / Zip Code" inputmode="numeric" pattern="[0-9]{4,10}"
                                maxlength="10" title="Enter a valid ZIP/postal code (numbers only)"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        </div>
                        <div class="input-group">
                            <select>
                                <option value="" disabled selected>Country</option>
                                <option value="IN">India</option>
                                <option value="US">United States</option>
                                <option value="UK">United Kingdom</option>
                                <option value="CA">Canada</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- STEP 2: Parent/Guardian Details -->
                <div class="form-step" id="step-2">
                    <div class="section-title">Parent/Guardian Name</div>
                    <div class="input-row">
                        <div class="input-group">
                            <input type="text" placeholder="First Name" required>
                        </div>
                        <div class="input-group">
                            <input type="text" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="section-title">Relationship</div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Relationship to Student" required>
                    </div>

                    <div class="section-title">Parent/Guardian Phone</div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Phone Number" inputmode="numeric" pattern="[0-9]{10,15}"
                            maxlength="15" title="Enter a valid phone number (10-15 digits)"
                            oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                    </div>

                    <div class="section-title">Parent/Guardian Email</div>
                    <div class="input-group full-width">
                        <input type="email" placeholder="Email Address">
                    </div>

                    <div class="section-title">Occupation</div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Occupation">
                    </div>
                </div>

                <!-- STEP 3: Academic & Submit -->
                <div class="form-step" id="step-3">
                    <div class="section-title">Applying For Class/Grade</div>
                    <div class="input-group full-width">
                        <select required>
                            <option value="" disabled selected>Select Class</option>
                            <option value="1">Class 1</option>
                            <option value="2">Class 2</option>
                            <option value="3">Class 3</option>
                            <option value="4">Class 4</option>
                            <option value="5">Class 5</option>
                            <option value="6">Class 6</option>
                            <option value="7">Class 7</option>
                            <option value="8">Class 8</option>
                            <option value="9">Class 9</option>
                            <option value="10">Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                        </select>
                    </div>

                    <div class="section-title">Previous School Name</div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Previous School Name">
                    </div>

                    <div class="section-title">Previous Class/Grade</div>
                    <div class="input-group full-width">
                        <input type="text" placeholder="Previous Class/Grade">
                    </div>

                    <div class="section-title">Special Notes / Medical History</div>
                    <div class="input-group full-width">
                        <textarea rows="4" placeholder="Mention any allergies or medical conditions..."></textarea>
                    </div>
                </div>

                <div class="form-footer">
                    <button type="button" class="nav-btn" id="nextBtn" onclick="nextStep()">Next</button>
                    <div class="step-indicator" id="stepIndicator">1 / 3</div>
                </div>
            </form>
        </div>

        <script src="Admission Form.js"></script>
    </body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Captcha Verification</title>
    <link rel="stylesheet" href="Captcha Verification.css">
</head>

<body>

    <div class="pointer-light" id="pointerLight"></div>
    <div class="noise"></div>

    <main class="card" id="card">
        <h1 id="title">Enter Captcha</h1>
        <p class="subtitle" id="subtitle">Type the characters shown in the image.</p>

        <div class="stage" id="stage">
            <div class="captcha-stage" id="captchaStage">
                <div class="captcha-display">
                    <canvas id="captchaCanvas" width="200" height="70"></canvas>
                    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh captcha">⟳</button>
                </div>
                <input type="text" class="captcha-input" id="captchaInput" maxlength="6" autocomplete="off"
                    placeholder="Enter code" aria-label="Enter captcha code">
            </div>

            <div class="orbit-layer" id="orbitLayer">
                <div class="orbit-ring" id="orbitRing"></div>
            </div>

            <div class="loading-wrap" id="loadingWrap">
                <div class="loading-core">
                    <div class="loading-ring"></div>
                    <div class="loading-pulse"></div>
                    <div class="loading-inner" id="loadingPercent">0</div>
                </div>
            </div>

            <div class="success-wrap" id="successWrap">
                <div class="success-flash"></div>
                <div class="bubble"></div>
                <div class="bubble"></div>
                <div class="bubble"></div>
                <div class="success-vault">
                    <svg class="checkmark" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="success-badge">Verified</div>
            </div>
        </div>

        <div class="error-msg" id="errorMsg">Incorrect code. Please try again.</div>

        <button class="verify-btn" id="verifyBtn">Verify</button>
    </main>

    <script src="Captcha Verification.js"></script>
</body>

</html>

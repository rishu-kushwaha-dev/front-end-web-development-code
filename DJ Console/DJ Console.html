<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Console</title>
    <link rel="stylesheet" href="DJ Console.css">
</head>

<body>
    <div class="console">
        <header class="top">
            <h1>🎧 DJ Console</h1>
            <div class="master">
                <label>Master Volume <input type="range" id="masterVol" min="0" max="1" step="0.01" value="0.8"></label>
            </div>
        </header>

        <section class="decks">
            <!-- DECK A -->
            <div class="deck deck-a">
                <h2>Deck A</h2>
                <div class="vinyl" id="vinylA">
                    <div class="label">A</div>
                </div>
                <input type="file" id="fileA" accept="audio/*">
                <div class="track-name" id="nameA">No track loaded</div>
                <div class="controls">
                    <button id="playA">▶ Play</button>
                    <button id="cueA">⏭ Cue</button>
                    <button id="syncA">Sync</button>
                </div>
                <div class="eq">
                    <label>HI <input type="range" id="hiA" min="0" max="2" step="0.01" value="1"></label>
                    <label>MID <input type="range" id="midA" min="0" max="2" step="0.01" value="1"></label>
                    <label>LO <input type="range" id="loA" min="0" max="2" step="0.01" value="1"></label>
                </div>
                <label>Volume A <input type="range" id="volA" min="0" max="1" step="0.01" value="0.8"></label>
                <label>Speed <input type="range" id="speedA" min="0.5" max="1.5" step="0.01" value="1"></label>
                <div class="bpm">BPM: <span id="bpmA">--</span></div>
            </div>

            <!-- MIXER -->
            <div class="mixer">
                <h2>Mixer</h2>
                <label>Crossfader
                    <input type="range" id="crossfader" min="0" max="1" step="0.01" value="0.5" orient="vertical">
                </label>
                <div class="cf-labels"><span>A</span><span>B</span></div>
            </div>

            <!-- DECK B -->
            <div class="deck deck-b">
                <h2>Deck B</h2>
                <div class="vinyl" id="vinylB">
                    <div class="label">B</div>
                </div>
                <input type="file" id="fileB" accept="audio/*">
                <div class="track-name" id="nameB">No track loaded</div>
                <div class="controls">
                    <button id="playB">▶ Play</button>
                    <button id="cueB">⏭ Cue</button>
                    <button id="syncB">Sync</button>
                </div>
                <div class="eq">
                    <label>HI <input type="range" id="hiB" min="0" max="2" step="0.01" value="1"></label>
                    <label>MID <input type="range" id="midB" min="0" max="2" step="0.01" value="1"></label>
                    <label>LO <input type="range" id="loB" min="0" max="2" step="0.01" value="1"></label>
                </div>
                <label>Volume B <input type="range" id="volB" min="0" max="1" step="0.01" value="0.8"></label>
                <label>Speed <input type="range" id="speedB" min="0.5" max="1.5" step="0.01" value="1"></label>
                <div class="bpm">BPM: <span id="bpmB">--</span></div>
            </div>
        </section>
        <section class="sources">
            <h2>Sources</h2>
            <div class="src-row">
                <input type="text" id="ytUrl" placeholder="Paste YouTube URL or video ID">
                <button id="loadYt">Load YouTube</button>
            </div>
            <div id="ytPlayer" class="yt-box"></div>
            <div class="src-row">
                <input type="file" id="bgFile" accept="audio/*">
                <label>Background Vol <input type="range" id="bgVol" min="0" max="1" step="0.01" value="0.4"></label>
                <button id="bgPlay">Play/Pause BG</button>
            </div>
            <div class="links">
                <a href="https://open.spotify.com" target="_blank">Spotify</a>
                <a href="https://music.apple.com" target="_blank">Apple Music</a>
                <a href="https://www.youtube.com" target="_blank">YouTube</a>
            </div>
        </section>
        <script src="DJ Console.js"></script>
    </div>
</body>

</html>

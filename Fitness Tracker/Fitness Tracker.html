<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="Fitness Tracker.css" />
</head>

<body>
    <header class="hero">
        <h1>💪 Fitness Tracker</h1>
        <p>Track workouts, calories, steps & water — all in one place.</p>
    </header>

    <main class="container">
        <section class="stats">
            <div class="card">
                <h3>Steps Today</h3>
                <p class="value" id="steps">0</p>
            </div>
            <div class="card">
                <h3>Calories Burned</h3>
                <p class="value" id="calories">0</p>
            </div>
            <div class="card">
                <h3>Water (ml)</h3>
                <p class="value" id="water">0</p>
            </div>
            <div class="card">
                <h3>Workouts</h3>
                <p class="value" id="workouts">0</p>
            </div>
        </section>

        <section class="panel">
            <h2>Log Activity</h2>
            <form id="activityForm" class="form">
                <select id="activityType" required>
                    <option value="steps">Steps</option>
                    <option value="calories">Calories Burned</option>
                    <option value="water">Water (ml)</option>
                    <option value="workout">Workout (min)</option>
                </select>
                <input type="number" id="activityValue" placeholder="Amount" min="1" required />
                <button type="submit">Add</button>
            </form>
        </section>

        <section class="panel">
            <h2>Activity Log</h2>
            <ul id="logList" class="log"></ul>
            <button id="clearBtn" class="danger">Clear All</button>
        </section>
    </main>

    <script src="Fitness Tracker.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <link rel="stylesheet" href="2048 Game.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">SCORE</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">BEST</div>
                    <div class="score-value" id="best">0</div>
                </div>
            </div>
        </div>
        <div class="game-intro">
            <p>Join the tiles, get to <strong>2048!</strong></p>
            <button class="new-game-btn" id="newGameBtn">New Game</button>
        </div>
        <div class="grid-container">
            <div class="grid" id="grid"></div>
        </div>
        <div class="game-message" id="gameMessage">
            <p id="gameMessageText"></p>
            <button id="retryBtn">Try Again</button>
        </div>
    </div>
    <script src="2048 Game.js"></script>
</body>

</html>

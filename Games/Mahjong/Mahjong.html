<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Mahjong</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.wrap{text-align:center}.board{position:relative;width:600px;height:400px;margin:10px auto} .tile{position:absolute;width:40px;height:50px;background:#f8fafc;color:#0f172a;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:2px 2px 4px #000}
.sel{outline:3px solid #facc15}button{margin:5px;padding:8px 14px;border:none;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer}
#msg{margin-top:8px}</style></head><body>
<div class="wrap"><h1>Mahjong Solitaire</h1><div id="board" class="board"></div><button onclick="newGame()">New Game</button><p id="msg"></p></div>
<script>
const tiles=[' dragons',' winds',' bamboo',' chars',' dots'];
let layout=[], sel=null;
function newGame(){
  // generate simple layered layout with pairs
  const pairs=[];
  for(let i=0;i<18;i++){ const t=Math.floor(Math.random()*tiles.length); pairs.push(t,t); }
  shuffle(pairs);
  layout=[];
  let idx=0;
  // base layer 6x6
  for(let r=0;r<6;r++) for(let c=0;c<6;c++){ layout.push({r,c,layer:0,val:pairs[idx++],removed:false}); }
  // top layer 4x4
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){ layout.push({r:r+1,c:c+1,layer:1,val:pairs[idx++],removed:false}); }
  sel=null; render(); document.getElementById('msg').textContent='';
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function isFree(t){
  if(t.removed) return false;
  // not covered by higher layer tile
  const covered=layout.some(o=>!o.removed && o.layer>t.layer && o.r===t.r && o.c===t.c);
  if(covered) return false;
  // at least one side open
  const leftBlocked=layout.some(o=>!o.removed && o.layer===t.layer && o.r===t.r && o.c===t.c-1);
  const rightBlocked=layout.some(o=>!o.removed && o.layer===t.layer && o.r===t.r && o.c===t.c+1);
  return !(leftBlocked && rightBlocked);
}
function render(){
  const b=document.getElementById('board'); b.innerHTML='';
  layout.forEach((t,i)=>{
    if(t.removed) return;
    const d=document.createElement('div'); d.className='tile';
    d.style.left=(t.c*46 + t.layer*6)+'px';
    d.style.top=(t.r*54 + t.layer*6)+'px';
    d.style.zIndex=t.layer;
    d.textContent=tiles[t.val];
    if(sel===i) d.classList.add('sel');
    d.onclick=()=>click(i);
    b.appendChild(d);
  });
}
function click(i){
  const t=layout[i]; if(t.removed||!isFree(t)) return;
  if(sel===null){ sel=i; render(); return; }
  if(sel===i){ sel=null; render(); return; }
  if(layout[sel].val===t.val){
    layout[sel].removed=true; layout[i].removed=true; sel=null; render(); checkWin();
  } else { sel=i; render(); }
}
function checkWin(){ if(layout.every(t=>t.removed)) document.getElementById('msg').textContent='You Win!'; }
newGame();
</script></body></html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="Rock Paper Scissior Game.css">
</head>

<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <div class="score-board">
            <div class="score">
                <span class="label">Player</span>
                <span class="score-value" id="player-score">0</span>
            </div>
            <div class="score">
                <span class="label">Computer</span>
                <span class="score-value" id="computer-score">0</span>
            </div>
        </div>

        <div class="result">
            <p id="result-text">Choose your move!</p>
        </div>

        <div class="choices">
            <button class="choice" data-choice="rock" title="Rock">
                <span class="choice-emoji">🪨</span>
                <span class="choice-name">Rock</span>
            </button>
            <button class="choice" data-choice="paper" title="Paper">
                <span class="choice-emoji">📄</span>
                <span class="choice-name">Paper</span>
            </button>
            <button class="choice" data-choice="scissors" title="Scissors">
                <span class="choice-emoji">✂️</span>
                <span class="choice-name">Scissors</span>
            </button>
        </div>

        <div class="display">
            <div class="side">
                <h3>You</h3>
                <div class="choice-display" id="player-choice">?</div>
            </div>
            <div class="side">
                <h3>Computer</h3>
                <div class="choice-display" id="computer-choice">?</div>
            </div>
        </div>

        <button class="reset-btn" id="reset-btn">Reset Score</button>
    </div>

    <script src="Rock Paper Scissior Game.js"></script>
</body>

</html>

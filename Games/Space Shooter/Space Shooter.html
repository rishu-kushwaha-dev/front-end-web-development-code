<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Space Shooter</title>
        <link rel="stylesheet" href="Space Shooter.css">
    </head>

    <body>
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            <div id="ui-overlay">
                <div class="hud-item">Score: <span id="score">0</span></div>
                <div class="hud-item">High: <span id="high-score">0</span></div>
                <div class="hud-item">Level: <span id="level">1</span></div>
                <div class="hud-item">Lives: <span id="lives">3</span></div>
            </div>
            <div id="powerup-status"></div>
            <div id="start-screen">
                <h1>Space Shooter</h1>
                <p>Move: Left/Right Arrow Keys or A/D</p>
                <p>Shoot: Auto-fire</p>
                <p>Pause: P</p>
                <p>Power-ups: Shield, Rapid Fire, Extra Life</p>
                <button id="start-btn">Start Game</button>
            </div>
            <div id="pause-screen" style="display: none;">
                <h1>Paused</h1>
                <p>Press P to Resume</p>
            </div>
            <div id="game-over-screen" style="display: none;">
                <h1>Game Over</h1>
                <p id="final-score">Final Score: 0</p>
                <p id="best-score">High Score: 0</p>
                <p id="new-high" style="display:none;">New High Score!</p>
                <button id="restart-btn">Play Again</button>
            </div>
        </div>
        <script src="Space Shooter.js"></script>
    </body>

</html>

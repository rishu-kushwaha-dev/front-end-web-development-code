<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="Tic Tac Toe.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container" id="container">

    <div class="start-screen" id="startScreen">
      <div class="start-card">
        <h1 class="game-title">Tic Tac Toe</h1>
        <p class="game-subtitle">Challenge the AI</p>
        <div class="player-select">
          <label class="select-label">Choose your mark:</label>
          <div class="mark-buttons">
            <button class="mark-btn" id="markX" onclick="chooseMark('X')">X</button>
            <button class="mark-btn" id="markO" onclick="chooseMark('O')">O</button>
          </div>
        </div>
        <button class="start-btn" id="startBtn" onclick="startGame()" disabled>Start Game</button>
      </div>
    </div>

    <div class="game-screen" id="gameScreen" style="display:none;">
      <div class="header">
        <h1 class="game-title">Tic Tac Toe</h1>
        <button class="home-btn" id="homeBtn" onclick="goHome()">⌂</button>
      </div>

      <div class="scoreboard">
        <div class="score-card player-score">
          <span class="score-label">You</span>
          <span class="score-value" id="playerScore">0</span>
        </div>
        <div class="score-card draw-score">
          <span class="score-label">Draw</span>
          <span class="score-value" id="drawScore">0</span>
        </div>
        <div class="score-card ai-score">
          <span class="score-label">AI</span>
          <span class="score-value" id="aiScore">0</span>
        </div>
      </div>

      <div class="turn-indicator" id="turnIndicator">Your turn — X</div>

      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>

      <div class="message" id="message"></div>

      <div class="button-row">
        <button class="reset-btn" onclick="resetGame()">New Round</button>
        <button class="reset-btn secondary" onclick="goHome()">Menu</button>
      </div>

      <button class="play-again-btn-bottom" onclick="playAgain()">Play Again</button>
    </div>

  </div>

  <script src="Tic Tac Toe.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GitHub Profile Finder</title>
        <link rel="stylesheet" href="GitHub Profile Finder.css">
    </head>

    <body>
        <div class="container">
            <header>
                <h1>GitHub Profile Finder</h1>
                <p>Search any GitHub user and view their profile & repositories</p>
            </header>

            <div class="search-box">
                <input type="text" id="username" placeholder="Enter GitHub username" autocomplete="off">
                <button id="searchBtn">Search</button>
            </div>

            <div id="error" class="error hidden"></div>

            <div id="loader" class="loader hidden">
                <div class="spinner"></div>
                <p>Loading profile...</p>
            </div>

            <div id="profile" class="profile-card hidden">
                <div class="profile-header">
                    <img id="avatar" class="avatar" alt="Profile picture">
                    <div class="profile-info">
                        <h2 id="name"></h2>
                        <a id="login" target="_blank" rel="noopener noreferrer"></a>
                        <p id="bio"></p>
                        <div class="profile-meta">
                            <span><strong id="location"></strong></span>
                            <span><strong id="company"></strong></span>
                            <span><strong id="blog"></strong></span>
                            <span><strong id="member-since"></strong></span>
                        </div>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-card">
                        <span class="stat-value" id="public-repos">0</span>
                        <span class="stat-label">Repositories</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="followers">0</span>
                        <span class="stat-label">Followers</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="following">0</span>
                        <span class="stat-label">Following</span>
                    </div>
                </div>

                <div class="repos-section">
                    <h3>Recent Repositories</h3>
                    <div id="repos" class="repos-list"></div>
                </div>
            </div>
        </div>
        <script src="GitHub Profile Finder.js"></script>
    </body>

</html>

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Link Tracker</title>
        <link rel="stylesheet" href="Link Tracker.css">
    </head>

    <body>
        <div class="container">
            <header>
                <h1>🔗 Link Tracker</h1>
                <p>Paste a URL to see where it actually leads</p>
            </header>

            <div class="input-section">
                <input type="text" id="urlInput" placeholder="https://example.com" />
                <button id="trackBtn">Track</button>
            </div>

            <div id="result" class="result hidden">
                <h2>Redirect Chain</h2>
                <div id="chainList" class="chain-list"></div>
                <div id="finalDestination" class="final-destination"></div>
                <div id="warningBox" class="warning-box hidden"></div>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Following redirects...</p>
            </div>

            <div id="errorBox" class="error-box hidden"></div>
        </div>

        <script src="Link Tracker.js"></script>
    </body>

</html>

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie Finder</title>
        <link rel="stylesheet" href="Movie Finder.css">
    </head>

    <body>
        <header>
            <h1>Movie Finder</h1>
        </header>

        <div class="container">
            <section class="trending-section">
                <h2>🔥 Trending Now</h2>
                <div id="trending-grid" class="movie-grid"></div>
            </section>

            <div class="search-box">
                <input type="text" id="movie-input" placeholder="Search for a movie..." autocomplete="off">
                <button id="search-btn">Search</button>
            </div>

            <div id="error-msg" class="error hidden"></div>

            <div id="movie-grid" class="movie-grid"></div>
        </div>

        <div id="movie-modal" class="modal hidden">
            <div class="modal-content">
                <button class="close-btn">&times;</button>
                <div id="modal-body"></div>
            </div>
        </div>

        <script src="Movie Finder.js"></script>
    </body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="Password Generator.css">
</head>

<body>
    <div class="container">
        <h1>Password Generator</h1>
        <p class="subtitle">Create PINs, Patterns, and Passwords</p>

        <div class="tabs">
            <button class="tab active" data-tab="pin">PIN</button>
            <button class="tab" data-tab="pattern">Pattern</button>
            <button class="tab" data-tab="password">Password</button>
        </div>

        <div class="tab-content" id="pinTab">
            <div class="password-display">
                <input type="text" id="pinOutput" readonly placeholder="Click Generate">
                <button id="pinCopyBtn" title="Copy to clipboard">Copy</button>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="pinLength">PIN Length: <span id="pinLengthValue">6</span></label>
                    <input type="range" id="pinLength" min="4" max="8" value="6">
                </div>
            </div>

            <button id="generatePinBtn" class="generate-btn">Generate PIN</button>
        </div>

        <div class="tab-content" id="patternTab" style="display:none;">
            <div class="password-display">
                <input type="text" id="patternOutput" readonly placeholder="Generate a pattern">
                <button id="patternCopyBtn" title="Copy to clipboard">Copy</button>
            </div>

            <div class="pattern-area">
                <div class="pattern-grid" id="patternGrid">
                    <div class="pattern-dot" data-index="0"></div>
                    <div class="pattern-dot" data-index="1"></div>
                    <div class="pattern-dot" data-index="2"></div>
                    <div class="pattern-dot" data-index="3"></div>
                    <div class="pattern-dot" data-index="4"></div>
                    <div class="pattern-dot" data-index="5"></div>
                    <div class="pattern-dot" data-index="6"></div>
                    <div class="pattern-dot" data-index="7"></div>
                    <div class="pattern-dot" data-index="8"></div>
                    <canvas id="patternCanvas" width="300" height="300"></canvas>
                </div>
            </div>

            <button id="generatePatternBtn" class="generate-btn">Generate Pattern</button>
        </div>

        <div class="tab-content" id="passwordTab" style="display:none;">
            <div class="password-display">
                <input type="text" id="passwordOutput" readonly placeholder="Click Generate">
                <button id="copyBtn" title="Copy to clipboard">Copy</button>
            </div>

            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
                <span id="strengthText">No password</span>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="lengthRange">Length: <span id="lengthValue">16</span></label>
                    <input type="range" id="lengthRange" min="6" max="64" value="16">
                </div>

                <div class="checkbox-group">
                    <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
                    <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
                    <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
                    <label><input type="checkbox" id="symbols" checked> Symbols (!@#$%)</label>
                </div>
            </div>

            <button id="generateBtn" class="generate-btn">Generate Password</button>
        </div>
    </div>

    <script src="Password Generator.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Tester</title>
    <link rel="stylesheet" href="Password Tester.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="password-card">

        <div class="card-header">
            <div class="lock-icon">
                <i class="ri-shield-keyhole-line"></i>
            </div>
            <div>
                <h1>Create A Strong Password</h1>
                <p>Make your password stronger and more secure</p>
            </div>
        </div>

        <div class="inputBox">
            <input type="password" id="inp" autocomplete="new-password" required>
            <label for="inp">Enter Your Password</label>
            <button id="eyeBtn" type="button">
                <i class="ri-eye-line"></i>
            </button>
        </div>

        <div class="passwordStatus">
            <div class="statusTop">
                <div>
                    <span>Password Strength</span>
                    <strong id="pStatus">Weak</strong>
                </div>

                <span id="strengthIcon" class="statsuIcon">
                    <i class="ri-shield-line"></i>
                </span>

            </div>

            <div class="range">
                <div class="rangeStatus"></div>
            </div>
        </div>

        <div class="requirements">
            <div class="requirements-title">
                <span>Password Requirements</span>
                <i class="ri-information-line"></i>
            </div>

            <div class="requirements-list">

                <div class="requirement" id="chars">
                    <span class="check">
                        <i class="ri-check-line"></i>
                    </span>
                    <span>At least 8 Characters</span>
                </div>

                <div class="requirement" id="AtoZ">
                    <span class="check">
                        <i class="ri-check-line"></i>
                    </span>
                    <span>One uppercase letter (A-Z)</span>
                </div>

                <div class="requirement" id="atoz">
                    <span class="check">
                        <i class="ri-check-line"></i>
                    </span>
                    <span>One lowercase letter (a-z)</span>
                </div>

                <div class="requirement" id="num">
                    <span class="check">
                        <i class="ri-check-line"></i>
                    </span>
                    <span>One Number (0-9)</span>
                </div>

                <div class="requirement" id="speChar">
                    <span class="check">
                        <i class="ri-check-line"></i>
                    </span>
                    <span>One special character (@#$)</span>
                </div>
            </div>
        </div>
    </main>

</body>
<script src="Password Tester.js"></script>

</html>

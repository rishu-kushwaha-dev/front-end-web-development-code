<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration Form</title>
        <link rel="stylesheet" href="Registration Form.css">
    </head>

    <body>
        <h1>Student Registration Form</h1>
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>
        <form id="regForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Student Photo</label>
                    <label for="photoInput" class="upload-btn">Upload Student Photo</label>
                    <input type="file" name="photo" accept="image/*" id="photoInput" hidden>
                    <img id="photoPreview" class="photo-preview" alt="Preview">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Father Name</label>
                    <input type="text" name="father_name" required>
                </div>
                <div class="form-group">
                    <label>Father's Occupation</label>
                    <input type="text" name="father_occupation" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Mother Name</label>
                    <input type="text" name="mother_name" required>
                </div>
                <div class="form-group">
                    <label>Mother's Occupation</label>
                    <input type="text" name="mother_occupation" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Alternate Phone Number</label>
                    <input type="tel" name="alternate_phone">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" name="dob" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <input type="radio" name="gender" value="male" required> Male
                        <input type="radio" name="gender" value="female" required> Female
                    </div>
                </div>
                <div class="form-group">
                    <label>Religion</label>
                    <select name="religion" required>
                        <option value="">Select</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Muslim">Muslim</option>
                        <option value="Christian">Christian</option>
                        <option value="Sikh">Sikh</option>
                        <option value="Buddhist">Buddhist</option>
                        <option value="Jain">Jain</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Caste</label>
                    <input type="text" name="caste" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Blood Group</label>
                    <select name="blood_group" required>
                        <option value="">Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Class Want to take admission</label>
                    <select name="class" required>
                        <option value="">Select</option>
                        <option value="1">1st Class</option>
                        <option value="2">2nd Class</option>
                        <option value="3">3rd Class</option>
                        <option value="4">4th Class</option>
                        <option value="5">5th Class</option>
                        <option value="6">6th Class</option>
                        <option value="7">7th Class</option>
                        <option value="8">8th Class</option>
                        <option value="9">9th Class</option>
                        <option value="10">10th Class</option>
                        <option value="11">11th Class</option>
                        <option value="12">12th Class</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date of Admission</label>
                    <input type="date" name="admission_date" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Any Disease</label>
                    <input type="text" name="disease">
                </div>
                <div class="form-group">
                    <label>Siblings</label>
                    <input type="number" name="siblings" min="0">
                </div>
                <div class="form-group">
                    <label>Siblings in the same school</label>
                    <input type="number" name="siblings_school" min="0">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Siblings Class</label>
                    <input type="text" name="siblings_class">
                </div>
                <div class="form-group">
                    <label>Last School Name</label>
                    <input type="text" name="last_school">
                </div>
                <div class="form-group">
                    <label>Parents Signature</label>
                    <input type="text" name="parents_signature" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Permanent Address</label>
                    <textarea name="address" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Temporary Address</label>
                    <textarea name="temp_address" rows="4"></textarea>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Reason for Leaving Last School</label>
                    <textarea name="reason" rows="4"></textarea>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" name="newsletter"> I want to receive the newsletter
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" name="terms" required> I agree to the terms and conditions
                    </div>
                </div>
            </div>
            <div class="button-row">
                <input type="reset" value="Reset">
                <input type="submit" value="Register">
            </div>
        </form>
        <div class="modal" id="successModal">
            <div class="modal-content">
                <h2>Registration Successful!</h2>
                <p>Dear Parents, your child has been registered.</p>
                <button id="closeModal">OK</button>
            </div>
        </div>
        <p class="note">Please fill out the form carefully and ensure all required fields are completed before
            submitting.</p>
        <script src="Registration Form.js"></script>

</html>

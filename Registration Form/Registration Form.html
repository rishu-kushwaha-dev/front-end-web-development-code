<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration Form</title>
        <link rel="stylesheet" href="Registration Form.css">
    </head>

    <body>
        <div class="container">
            <form id="registrationForm" class="registration-form" novalidate>
                <h2>Create Account</h2>

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required minlength="2" maxlength="50">
                    <span class="error-message" data-for="firstName"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required minlength="2" maxlength="50">
                    <span class="error-message" data-for="lastName"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" data-for="email"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10 digits">
                    <span class="error-message" data-for="phone"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required minlength="8" maxlength="128">
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                            <span class="eye-icon">👁</span>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill"></div>
                        </div>
                        <span class="strength-text"></span>
                    </div>
                    <span class="error-message" data-for="password"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <span class="error-message" data-for="confirmPassword"></span>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                    <span class="error-message" data-for="dob"></span>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="male" required>
                            <span class="radio-custom"></span>
                            Male
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="female">
                            <span class="radio-custom"></span>
                            Female
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="other">
                            <span class="radio-custom"></span>
                            Other
                        </label>
                    </div>
                    <span class="error-message" data-for="gender"></span>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span class="checkbox-custom"></span>
                        I agree to the <a href="#" class="link">Terms of Service</a> and <a href="#"
                            class="link">Privacy Policy</a>
                    </label>
                    <span class="error-message" data-for="terms"></span>
                </div>

                <button type="submit" class="submit-btn">Register</button>

                <p class="login-link">
                    Already have an account? <a href="#" class="link">Login</a>
                </p>
            </form>
        </div>
        <script src="Registration Form.js"></script>
    </body>

</html>

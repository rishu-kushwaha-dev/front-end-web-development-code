<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Screen Recorder</title>
        <link rel="stylesheet" href="Screen Recorder.css">
    </head>

    <body>
        <div class="container">
            <header>
                <h1>Screen Recorder</h1>
                <p class="subtitle">Record your screen with audio</p>
            </header>

            <main>
                <div class="preview-section">
                    <video id="preview" autoplay muted playsinline></video>
                    <div class="preview-overlay" id="previewOverlay">
                        <svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>Click "Start Recording" to begin</span>
                    </div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <button id="startBtn" class="btn btn-primary" aria-label="Start recording">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="12" cy="12" r="10"></circle>
                            </svg>
                            <span>Start Recording</span>
                        </button>
                        <button id="pauseBtn" class="btn btn-secondary" disabled aria-label="Pause recording">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                            <span>Pause</span>
                        </button>
                        <button id="stopBtn" class="btn btn-danger" disabled aria-label="Stop recording">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            </svg>
                            <span>Stop</span>
                        </button>
                    </div>

                    <div class="timer" id="timer" aria-live="polite">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>00:00:00</span>
                    </div>
                </div>

                <div class="options">
                    <fieldset>
                        <legend>Recording Options</legend>
                        <div class="option-row">
                            <label class="checkbox-label">
                                <input type="checkbox" id="audioCheckbox" checked>
                                <span class="checkmark"></span>
                                Record System Audio
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="micCheckbox">
                                <span class="checkmark"></span>
                                Record Microphone
                            </label>
                        </div>
                        <div class="option-row">
                            <label for="qualitySelect">Video Quality:</label>
                            <select id="qualitySelect">
                                <option value="high">High (1080p)</option>
                                <option value="medium" selected>Medium (720p)</option>
                                <option value="low">Low (480p)</option>
                            </select>
                        </div>
                    </fieldset>
                </div>

                <div class="recordings-section" id="recordingsSection" hidden>
                    <h2>Recordings</h2>
                    <div class="recordings-list" id="recordingsList"></div>
                </div>
            </main>

            <div class="toast-container" id="toastContainer"></div>
        </div>

        <script src="Screen Recorder.js"></script>
    </body>

</html>

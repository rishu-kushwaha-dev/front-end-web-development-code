<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Speech Converter</title>
<link rel="stylesheet" href="Text to Speech Converter.css">
</head>
<body>
  <div class="container">
    <h1>Text to Speech Converter</h1>
    <div class="toolbar">
      <span id="count">0 chars / 0 words</span>
      <button id="clear" class="small">Clear</button>
    </div>
    <textarea id="text" placeholder="Type something here..." rows="6"></textarea>
    <div class="controls">
      <label>Voice
        <select id="voice"></select>
      </label>
      <label>Language filter
        <input type="text" id="langFilter" placeholder="e.g. en">
      </label>
      <label>Rate
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
        <span id="rateVal">1</span>
      </label>
      <label>Pitch
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
        <span id="pitchVal">1</span>
      </label>
      <label>Volume
        <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
        <span id="volVal">1</span>
      </label>
      <label>Presets
        <select id="preset">
          <option value="">--</option>
          <option value="slow">Slow</option>
          <option value="normal">Normal</option>
          <option value="fast">Fast</option>
        </select>
      </label>
    </div>
    <div class="buttons">
      <button id="speak">Speak</button>
      <button id="speakSel">Speak Selection</button>
      <button id="pause">Pause</button>
      <button id="resume">Resume</button>
      <button id="stop">Stop</button>
    </div>
    <p id="status"></p>
    <h3>History</h3>
    <ul id="history"></ul>
    <button id="clearHist" class="small">Clear History</button>
  </div>
  <script src="Text to Speech Converter.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="To Do List.css">
</head>

<body>
    <canvas id="confetti"></canvas>
    <div class="container">
        <div class="header">
            <div class="date" id="date"></div>
            <h1>To Do List</h1>
            <p class="tagline">Stay organized, get things done.</p>
            <div class="stats" id="stats">
                <span id="items-left">0 items left</span>
                <span id="items-completed">0 completed</span>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
            <select id="prioritySelect">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <button class="add-btn" id="addBtn">Add</button>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="footer">
            <div class="filters" id="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button class="clear-btn" id="clearCompleted">Clear Completed</button>
        </div>
    </div>

    <script src="To Do List.js"></script>
</body>

</html>

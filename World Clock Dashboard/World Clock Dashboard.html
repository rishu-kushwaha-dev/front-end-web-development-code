<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Clock Dashboard</title>
  <link rel="stylesheet" href="World Clock Dashboard.css" />
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <h1>World Clock Dashboard</h1>
      <div class="header-controls">
        <label class="toggle" title="24-hour format">
          <input type="checkbox" id="formatToggle" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">24h</span>
        </label>
        <label class="toggle" title="Light/Dark theme">
          <input type="checkbox" id="themeToggle" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">☀️</span>
        </label>
      </div>
      <div class="local-time">
        <span class="local-date" id="localDate">--/--/---- --:--:-- --</span>
      </div>
    </header>

    <div class="clocks-grid" id="clocksGrid"></div>

    <button class="add-city-btn" id="addCityBtn" title="Add a city">+</button>

    <div class="modal" id="cityModal">
      <div class="modal-content">
        <h2>Add a City</h2>
        <input type="text" id="citySearch" placeholder="Search city or timezone" autocomplete="off" />
        <ul class="search-results" id="searchResults"></ul>
        <div class="custom-timezone">
          <label for="customTimezone">Or enter a custom IANA timezone:</label>
          <div class="custom-timezone-input">
            <input type="text" id="customTimezone" placeholder="e.g., America/New_York, Europe/London, Asia/Tokyo" autocomplete="off" />
            <button class="btn-add-custom" id="addCustomBtn">Add</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="cancelBtn">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="World Clock Dashboard.js"></script>
</body>
</html>
